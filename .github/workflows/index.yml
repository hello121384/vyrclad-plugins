name: Update plugin index
on:
  push:
    paths:
      - 'packages/**'
      - 'build_index.py'
      - '.github/workflows/index.yml'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: plugin-index
  cancel-in-progress: false

jobs:
  index:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: python3 build_index.py
      - name: Publish changed index
        run: |
          git add -- vyrclad-index.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update plugin package index'
            git push
          fi
